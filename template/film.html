    const oE = { x: 540, y: 590, s: inn, ry: (1 - inn) * 90 + sway(3), rx: sway(2, 1), op: inn * (1 - out) }; st8.set(codeE, oE);
    hl(codeE, 1, win(lt, 2.1, 4.8)); hl(codeE, 2, win(lt, 4.8, 13.4));
    const fi = lt < 7.0 ? 8 : lt < 11.0 ? Math.min(95, 8 + Math.floor((lt - 7.0) * 22)) : Math.min(215, 95 + Math.floor((lt - 11.0) * 60)); drawFrame(uiD, askF[fi], 0, 0, 900, 582);
    st8.set(uiD, { x: 540, y: 1300 + (1 - inn) * 900, s: lerp(1, 1.08, eio(pr(lt, 11.0, 12.0))), ry: sway(4, 2), rx: 4, op: 1 - out });
    beam(960, lineY(codeE, 2, oE), 960, 1180, win(lt, 11.1, 13.4), t, '#fde68a', 90);
    show(kk.d1, t, V(5, 11.9), S[6] - .3, 'zoom');
  } else put(kk.d1, 0);

  // ===== S7 recap + next =====
  if (sc === 6) { const eq = win(lt, 0, 7.4, .5, .5), ty = win(lt, 7.4, 12.0, .5, .5), nx = eo(pr(lt, 12.0, 12.7));
    coreP = [540, lerp(480, 420, eio(pr(lt, 7.2, 7.9))), back(pr(lt, .3, 1.1)) * lerp(.9, .6, eio(pr(lt, 7.2, 7.9))) * (1 - eio(pr(lt, 11.7, 12.2)))];
    show(kk.e1, t, V(6, 4.1), V(6, 7.4), 'rise'); show(kk.e2, t, V(6, 5.6), V(6, 7.4), 'zoom');
    const da = back(pr(lt, 5.9, 6.5)) * eq; put(docCard, Math.min(1, da), `translate(540px, 1090px) translate(-50%,-50%) scale(${.6 + .4 * da}) rotate(${Math.sin(t) * 2}deg)`);
    show(kk.e3, t, V(6, 6.1), V(6, 7.4), 'rise'); show(kk.e4, t, V(6, 6.6), V(6, 7.5), 'slam');
    const oT = { x: 540, y: 1060 + (1 - eo(pr(lt, 7.4, 8.1))) * 900, s: 1, ry: sway(3), rx: sway(2, 1), op: ty }; st8.set(codeT, oT);
    const chars = Math.floor(pr(lt, 8.0, 11.6) * typeSrc.join('\n').length); let left = chars; codeT.lines.forEach((l, i) => { const s = typeSrc[i].slice(0, Math.max(0, left)); left -= typeSrc[i].length + 1; l.querySelector('p').textContent = s + (left < 0 && left > -typeSrc[i].length - 1 ? '▌' : ''); });
    beam(540, 600, 540, 800, ty, t, '#67e8f9', 0);
    show(kk.n0, t, V(6, 12.1), S[7] - .3, 'zoom');
    rsteps.forEach((e, i) => { const a = back(pr(lt, 12.3 + i * .12, 12.9 + i * .12)) * (1 - eio(pr(lt, 14.9, 15.5))) * (1 - eio(pr(t, S[7] - .5, S[7]))); put(e, Math.min(1, a), `translateX(${(1 - Math.min(1, a)) * 200}px) scale(${i === 1 ? 1 + Math.sin(t * 5) * .03 : 1})`); });
    const fa = back(pr(lt, 15.3, 15.9)), ba = back(pr(lt, 16.9, 17.5)), fo = 1 - eio(pr(t, S[7] - .5, S[7]));
    put(halfF, Math.min(1, fa) * fo, `rotateY(${(1 - Math.min(1, fa)) * 90}deg) translateY(${sway(8)}px)`); put(halfB, Math.min(1, ba) * fo, `rotateY(${(1 - Math.min(1, ba)) * -90}deg) translateY(${sway(8, 2)}px)`);
    if (lt > 14.9) { const tt = eo(pr(lt, 14.9, 15.5)); put(rsteps[1], fo, `translateY(${-150 * tt}px) scale(${1 + .2 * tt})`); }
  } else { [kk.e1, kk.e2, kk.e3, kk.e4, kk.n0].forEach(e => put(e, 0)); put(docCard, 0); rsteps.forEach(e => put(e, 0)); put(halfF, 0); put(halfB, 0); }

  // ===== S8 CTA =====
  if (sc === 7) { const a = back(pr(lt, 0, .8)); flash = (1 - pr(lt, 0, .5)) * .8;
    put(logoBig, Math.min(1, a), `translate(220px, 220px) scale(${a * (1 + Math.sin(t * 3) * .015)})`);
    show(kk.c1, t, V(7, .9), TOTAL + 5, 'rise'); show(kk.c2, t, V(7, 1.5), TOTAL + 5, 'zoom'); show(kk.c3, t, V(7, 3.1), TOTAL + 5, 'wipe');
    const b = back(pr(lt, .25, .9)); const btn = document.getElementById('btn'); btn.style.opacity = Math.min(1, b); btn.style.transform = `scale(${b * (1 + Math.sin(t * 6) * .03)})`;
  } else { if (sc !== 0) put(logoBig, 0); [kk.c1, kk.c2, kk.c3].forEach(e => put(e, 0)); document.getElementById('btn').style.opacity = 0; }

  allCode.concat(allUi).forEach(p => panel(p, st8.get(p)));
  for (const [e, v] of tags) Array.isArray(v) ? tagAt(e, v[0], v[1], v[2]) : put(e, 0);
  setCore(coreP[0], coreP[1], coreP[2], t);
  fence.visible = fenceA > .01; fence.material.opacity = fenceA; fence.position.copy(core.position); fence.scale.setScalar(fenceS); fence.rotation.z = t * .3;
  document.getElementById('hud').style.opacity = hud; document.getElementById('flash').style.opacity = flash;
  document.body.style.opacity = 1 - pr(t, TOTAL - .8, TOTAL - .05);
  composer.render();
};
window.READY = true;
